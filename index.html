<!DOCTYPE html>
<html lang="el">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Συμβάσεις OneDrive</title>


  <script
    type="text/javascript"
    src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js">
  </script>


  <style>

    body {

      font-family: Arial, sans-serif;

      background: #f4f6f8;

      margin: 0;

      padding: 30px;

    }


    .box {

      max-width: 1000px;

      margin: auto;

      background: white;

      padding: 30px;

      border-radius: 12px;

      box-shadow:
        0 3px 15px rgba(0,0,0,0.12);

    }


    h1 {

      margin-top: 0;

    }


    h2 {

      margin-top: 30px;

    }


    button {

      padding: 12px 18px;

      margin: 5px;

      border: none;

      border-radius: 7px;

      cursor: pointer;

      font-size: 15px;

    }


    #loginBtn {

      background: #0078d4;

      color: white;

    }


    #logoutBtn {

      background: #666;

      color: white;

    }


    #refreshBtn {

      background: #107c10;

      color: white;

    }


    #uploadBtn {

      background: #d83b01;

      color: white;

    }


    button:hover {

      opacity: 0.85;

    }


    #status {

      margin-top: 20px;

      padding: 15px;

      background: #eef3f8;

      border-radius: 8px;

      white-space: pre-wrap;

    }


    .upload-area {

      margin-top: 25px;

      padding: 20px;

      border:
        2px dashed #aaa;

      border-radius: 10px;

      background: #fafafa;

    }


    input[type="file"] {

      margin: 10px 0;

    }


    .file {

      padding: 12px;

      margin-top: 8px;

      background: #f2f2f2;

      border-radius: 7px;

      cursor: pointer;

    }


    .file:hover {

      background: #e5e5e5;

    }


    #files {

      margin-top: 15px;

    }


    .success {

      color: green;

      font-weight: bold;

    }


    .error {

      color: #c00000;

      font-weight: bold;

    }

  </style>

</head>


<body>


<div class="box">


  <h1>Συμβάσεις OneDrive</h1>


  <p>

    Σύνδεση της εφαρμογής
    με το προσωπικό Microsoft OneDrive.

  </p>



  <button
    id="loginBtn"
    onclick="signIn()">

    Σύνδεση Microsoft

  </button>



  <button
    id="logoutBtn"
    onclick="signOut()">

    Αποσύνδεση

  </button>



  <button
    id="refreshBtn"
    onclick="loadFiles()">

    Ανανέωση αρχείων

  </button>



  <div id="status">

    Δεν υπάρχει ενεργή σύνδεση.

  </div>



  <div class="upload-area">


    <h2>
      Αποθήκευση αρχείου στο OneDrive
    </h2>


    <p>

      Επίλεξε ένα αρχείο
      από τον υπολογιστή σου
      και πάτησε
      <strong>
        Αποθήκευση στο OneDrive
      </strong>.

    </p>



    <input
      type="file"
      id="fileInput"
    >


    <br>


    <button
      id="uploadBtn"
      onclick="uploadFile()">

      Αποθήκευση στο OneDrive

    </button>


  </div>



  <h2>
    Αρχεία στο OneDrive
  </h2>


  <div id="files">

    Δεν έχουν φορτωθεί αρχεία.

  </div>


</div>



<script>


/* =====================================================
   ΡΥΘΜΙΣΕΙΣ MICROSOFT
   ===================================================== */


const msalConfig = {


  auth: {


    clientId:
      "d15aa5e9-860e-4e0a-af14-283c401a08cc",


    authority:
      "https://login.microsoftonline.com/common",


    redirectUri:
      "https://spirosdalianismech-art.github.io/symvaseis-onedrive/"


  },


  cache: {


    cacheLocation:
      "localStorage",


    storeAuthStateInCookie:
      false


  }


};



const msalInstance =
  new msal.PublicClientApplication(
    msalConfig
  );



const loginRequest = {


  scopes: [

    "User.Read",

    "Files.ReadWrite"

  ],


  prompt:
    "select_account"


};



/* =====================================================
   STATUS
   ===================================================== */


function setStatus(
  message,
  type = ""
) {


  const status =
    document.getElementById(
      "status"
    );


  status.className =
    type;


  status.innerText =
    message;


}



/* =====================================================
   LOGIN
   ===================================================== */


async function signIn() {


  try {


    setStatus(
      "Γίνεται σύνδεση με Microsoft..."
    );


    const response =
      await msalInstance.loginPopup(
        loginRequest
      );


    msalInstance.setActiveAccount(
      response.account
    );


    setStatus(

      "Συνδεθήκατε ως:\n" +

      response.account.username,

      "success"

    );


    await loadFiles();


  }


  catch (error) {


    console.error(
      error
    );


    setStatus(

      "Σφάλμα σύνδεσης:\n\n" +

      error.message,

      "error"

    );


  }


}



/* =====================================================
   LOGOUT
   ===================================================== */


async function signOut() {


  try {


    const account =
      await getAccount();


    if (!account) {


      setStatus(
        "Δεν υπάρχει ενεργός λογαριασμός."
      );


      return;


    }


    await msalInstance.logoutPopup({


      account:
        account,


      postLogoutRedirectUri:

        "https://spirosdalianismech-art.github.io/symvaseis-onedrive/"


    });



    document
      .getElementById(
        "files"
      )
      .innerHTML =

      "Δεν έχουν φορτωθεί αρχεία.";



    setStatus(
      "Έγινε αποσύνδεση."
    );


  }


  catch (error) {


    console.error(
      error
    );


    setStatus(

      "Σφάλμα αποσύνδεσης:\n" +

      error.message,

      "error"

    );


  }


}



/* =====================================================
   GET ACCOUNT
   ===================================================== */


async function getAccount() {


  let account =
    msalInstance.getActiveAccount();


  if (!account) {


    const accounts =
      msalInstance.getAllAccounts();


    if (
      accounts.length > 0
    ) {


      account =
        accounts[0];


      msalInstance.setActiveAccount(
        account
      );


    }


  }


  return account;


}



/* =====================================================
   GET TOKEN
   ===================================================== */


async function getToken() {


  const account =
    await getAccount();


  if (!account) {


    throw new Error(

      "Πρέπει πρώτα να πατήσετε «Σύνδεση Microsoft»."

    );


  }



  const tokenRequest = {


    scopes: [

      "User.Read",

      "Files.ReadWrite"

    ],


    account:
      account


  };



  try {


    const response =

      await msalInstance
        .acquireTokenSilent(
          tokenRequest
        );


    return response.accessToken;


  }


  catch (error) {


    console.log(

      "Silent token failed. Χρήση popup.",

      error

    );


    const response =

      await msalInstance
        .acquireTokenPopup(
          tokenRequest
        );


    return response.accessToken;


  }


}



/* =====================================================
   LOAD FILES
   ===================================================== */


async function loadFiles() {


  const filesDiv =
    document.getElementById(
      "files"
    );


  try {


    filesDiv.innerHTML =
      "Φόρτωση αρχείων...";


    const token =
      await getToken();



    const response =
      await fetch(


        "https://graph.microsoft.com/v1.0/me/drive/root/children",


        {


          method:
            "GET",


          headers: {


            "Authorization":
              "Bearer " + token,


            "Accept":
              "application/json"


          }


        }


      );



    if (!response.ok) {


      const errorText =
        await response.text();


      throw new Error(

        "Microsoft Graph error " +

        response.status +

        "\n\n" +

        errorText

      );


    }



    const data =
      await response.json();



    filesDiv.innerHTML =
      "";



    if (

      !data.value ||

      data.value.length === 0

    ) {


      filesDiv.innerHTML =

        "Δεν υπάρχουν αρχεία στο OneDrive.";


      setStatus(

        "Η σύνδεση με το OneDrive λειτουργεί κανονικά.",

        "success"

      );


      return;


    }



    data.value.forEach(

      item => {


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "file";



        if (
          item.folder
        ) {


          div.textContent =

            "📁 " +

            item.name;


        }


        else {


          div.textContent =

            "📄 " +

            item.name;


        }



        if (
          item.webUrl
        ) {


          div.onclick =
            function() {


              window.open(

                item.webUrl,

                "_blank"

              );


            };


        }



        filesDiv.appendChild(
          div
        );


      }

    );



    setStatus(

      "Η σύνδεση με το OneDrive λειτουργεί κανονικά.",

      "success"

    );


  }


  catch (error) {


    console.error(
      error
    );


    filesDiv.innerHTML =

      "Δεν ήταν δυνατή η φόρτωση των αρχείων.";



    setStatus(

      "Σφάλμα OneDrive:\n\n" +

      error.message,

      "error"

    );


  }


}



/* =====================================================
   UPLOAD FILE
   ===================================================== */


async function uploadFile() {


  const input =
    document.getElementById(
      "fileInput"
    );



  if (

    !input.files ||

    input.files.length === 0

  ) {


    alert(

      "Επίλεξε πρώτα ένα αρχείο."

    );


    return;


  }



  const file =
    input.files[0];



  try {


    setStatus(

      "Γίνεται αποθήκευση του αρχείου:\n" +

      file.name

    );



    const token =
      await getToken();



    const encodedFileName =
      encodeURIComponent(
        file.name
      );



    const uploadUrl =

      "https://graph.microsoft.com/v1.0/me/drive/root:/" +

      encodedFileName +

      ":/content";



    const response =
      await fetch(


        uploadUrl,


        {


          method:
            "PUT",


          headers: {


            "Authorization":
              "Bearer " + token,


            "Content-Type":
              file.type ||

              "application/octet-stream"


          },


          body:
            file


        }


      );



    if (!response.ok) {


      const errorText =
        await response.text();


      throw new Error(

        "Microsoft Graph error " +

        response.status +

        "\n\n" +

        errorText

      );


    }



    const uploadedFile =
      await response.json();



    setStatus(

      "Το αρχείο αποθηκεύτηκε επιτυχώς στο OneDrive.\n\n" +

      "Όνομα αρχείου:\n" +

      uploadedFile.name,

      "success"

    );



    input.value =
      "";



    await loadFiles();


  }


  catch (error) {


    console.error(
      error
    );


    setStatus(

      "Σφάλμα αποθήκευσης:\n\n" +

      error.message,

      "error"

    );


  }


}



/* =====================================================
   INITIAL LOAD
   ===================================================== */


window.addEventListener(

  "load",

  async function() {


    try {


      const account =
        await getAccount();



      if (account) {


        setStatus(

          "Συνδεδεμένος ως:\n" +

          account.username,

          "success"

        );


        await loadFiles();


      }


      else {


        setStatus(

          "Δεν υπάρχει ενεργή σύνδεση.\n\n" +

          "Πατήστε «Σύνδεση Microsoft»."

        );


      }


    }


    catch (error) {


      console.error(
        error
      );


    }


  }

);


</script>


</body>

</html>
