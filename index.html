<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Συμβάσεις OneDrive</title>

  <script
    type="text/javascript"
    src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      margin-right: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 20px 0;
      font-weight: bold;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .file {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Συμβάσεις OneDrive</h1>

  <p>Σύνδεση με Microsoft 365 και OneDrive</p>

  <button onclick="signIn()">
    Σύνδεση με Microsoft
  </button>

  <button onclick="loadFiles()">
    Εμφάνιση αρχείων OneDrive
  </button>

  <div id="status">
    Δεν έχει γίνει σύνδεση.
  </div>

  <div id="files"></div>

</div>

<script>

const msalConfig = {
  auth: {
    clientId: "d15aa5e9-860e-4e0a-af14-283c401a08cc",
    authority: "https://login.microsoftonline.com/a17412e1-e4a8-4fed-835a-d1e613cf24d3",
    redirectUri: "https://spirosdalianismech-art.github.io/symvaseis-onedrive/"
  },

  cache: {
    cacheLocation: "sessionStorage",
    storeAuthStateInCookie: false
  }
};


const msalInstance =
  new msal.PublicClientApplication(msalConfig);


const loginRequest = {
  scopes: [
    "User.Read",
    "Files.ReadWrite"
  ]
};


async function signIn() {

  const status =
    document.getElementById("status");

  try {

    status.innerHTML =
      "Γίνεται σύνδεση με Microsoft...";

    const response =
      await msalInstance.loginPopup(loginRequest);

    msalInstance.setActiveAccount(
      response.account
    );

    status.innerHTML =
      "Συνδεθήκατε ως: " +
      response.account.username;

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "Σφάλμα σύνδεσης:\n" +
      error.message;
  }
}


async function getAccount() {

  let account =
    msalInstance.getActiveAccount();

  if (!account) {

    const accounts =
      msalInstance.getAllAccounts();

    if (accounts.length > 0) {

      account = accounts[0];

      msalInstance.setActiveAccount(account);
    }
  }

  return account;
}


async function getToken() {

  const account =
    await getAccount();

  if (!account) {

    throw new Error(
      "Πρέπει πρώτα να πατήσετε «Σύνδεση με Microsoft»."
    );
  }

  try {

    const response =
      await msalInstance.acquireTokenSilent({
        scopes: [
          "User.Read",
          "Files.ReadWrite"
        ],
        account: account
      });

    return response.accessToken;

  } catch (error) {

    console.log(
      "Silent token failed. Χρήση popup.",
      error
    );

    const response =
      await msalInstance.acquireTokenPopup({
        scopes: [
          "User.Read",
          "Files.ReadWrite"
        ],
        account: account
      });

    return response.accessToken;
  }
}


async function loadFiles() {

  const status =
    document.getElementById("status");

  const filesDiv =
    document.getElementById("files");

  try {

    status.innerHTML =
      "Ανάκτηση αρχείων από το OneDrive...";

    filesDiv.innerHTML = "";

    const token =
      await getToken();

    const response =
      await fetch(
        "https://graph.microsoft.com/v1.0/me/drive/root/children",
        {
          method: "GET",
          headers: {
            "Authorization":
              "Bearer " + token,
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        "Microsoft Graph error " +
        response.status +
        ":\n\n" +
        errorText
      );
    }


    const data =
      await response.json();


    filesDiv.innerHTML =
      "<h2>Αρχεία OneDrive</h2>";


    if (
      !data.value ||
      data.value.length === 0
    ) {

      filesDiv.innerHTML +=
        "<p>Δεν βρέθηκαν αρχεία στον κεντρικό φάκελο του OneDrive.</p>";

    } else {

      data.value.forEach(function(item) {

        const div =
          document.createElement("div");

        div.className =
          "file";

        if (item.folder) {

          div.textContent =
            "📁 " + item.name;

        } else {

          div.textContent =
            "📄 " + item.name;
        }

        filesDiv.appendChild(div);
      });
    }


    status.innerHTML =
      "Η σύνδεση με το OneDrive λειτουργεί κανονικά.";

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "Σφάλμα:\n" +
      error.message;
  }
}

</script>

</body>
</html>
