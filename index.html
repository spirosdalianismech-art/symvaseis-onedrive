<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Συμβάσεις OneDrive</title>

  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 40px;
    }

    .box {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 12px 20px;
      margin-right: 10px;
      margin-bottom: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin: 20px 0;
      font-weight: bold;
    }

    #files {
      margin-top: 20px;
    }

    .file {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Συμβάσεις OneDrive</h1>

  <p>Σύνδεση με Microsoft 365 και OneDrive</p>

  <button onclick="signIn()">Σύνδεση με Microsoft</button>

  <button onclick="loadFiles()">Εμφάνιση αρχείων OneDrive</button>

  <div id="status">Δεν έχει γίνει σύνδεση.</div>

  <div id="files"></div>

</div>

<script>

const msalConfig = {
    auth: {
        clientId: "d15aa5e9-860e-4e0a-af14-283c401a08cc",
        authority: "https://login.microsoftonline.com/a17412e1-e4a8-4fed-835a-d1e613cf24d3",
        redirectUri: "https://spirosdalianismech-art.github.io/symvaseis-onedrive/"
    },
    cache: {
        cacheLocation: "sessionStorage"
    }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);
let msalReady = false;

async function initializeMsal() {
    await msalInstance.initialize();
    msalReady = true;
}

initializeMsal();
  
const loginRequest = {
    scopes: [
        "User.Read",
        "Files.ReadWrite"
    ]
};

async function signIn() {

    try {
        if (!msalReady) {
    await msalInstance.initialize();
    msalReady = true;
        }
        const response = await msalInstance.loginPopup(loginRequest);

        msalInstance.setActiveAccount(response.account);

        document.getElementById("status").innerHTML =
            "Συνδεθήκατε ως: " + response.account.username;

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "Σφάλμα σύνδεσης: " + error.message;
    }
}


async function getToken() {

    let account = msalInstance.getActiveAccount();

    if (!account) {

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length > 0) {
            account = accounts[0];
            msalInstance.setActiveAccount(account);
        }
    }

    if (!account) {
        throw new Error("Πρέπει πρώτα να συνδεθείτε.");
    }

    try {

        const response = await msalInstance.acquireTokenSilent({
            scopes: ["Files.ReadWrite", "User.Read"],
            account: account
        });

        return response.accessToken;

    } catch {

        const response = await msalInstance.acquireTokenPopup({
            scopes: ["Files.ReadWrite", "User.Read"]
        });

        return response.accessToken;
    }
}


async function loadFiles() {

    try {

        const token = await getToken();

        document.getElementById("status").innerHTML =
            "Ανάκτηση αρχείων από το OneDrive...";

        const response = await fetch(
            "https://graph.microsoft.com/v1.0/me/drive/root/children",
            {
                headers: {
                    Authorization: "Bearer " + token
                }
            }
        );

        if (!response.ok) {
            throw new Error("Microsoft Graph error: " + response.status);
        }

        const data = await response.json();

        const filesDiv = document.getElementById("files");

        filesDiv.innerHTML = "<h2>Αρχεία OneDrive</h2>";

        data.value.forEach(item => {

            const div = document.createElement("div");

            div.className = "file";

            div.textContent =
                (item.folder ? "📁 " : "📄 ") + item.name;

            filesDiv.appendChild(div);
        });

        document.getElementById("status").innerHTML =
            "Η σύνδεση με το OneDrive λειτουργεί.";

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "Σφάλμα: " + error.message;
    }
}

</script>

</body>
</html>
